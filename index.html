const LINK_CAPITULO_GRATIS = "https://ig.me/m/engenhariadosgastos";

/* ==========================================================================
   ESTADO E LÓGICA
   ========================================================================== */

let estado = {
    tela: "intro",
    indice1: 0,
    respostas1: [],
    indice2: 0,
    respostas2: [],
    candidatosDesempate: [],
    principal: null,
    sombra: null
};

function tally(lista) {
    const t = { "Dominante": 0, "Servidor": 0, "Analítico": 0, "Comunicativo": 0 };
    lista.forEach(v => { t[v]++; });
    return t;
}

function topEmpatados(t) {
    const max = Math.max(...Object.values(t));
    return Object.keys(t).filter(k => t[k] === max);
}

function iniciarQuiz() {
    estado = { tela: "quiz1", indice1: 0, respostas1: [], indice2: 0, respostas2: [], candidatosDesempate: [], principal: null, sombra: null };
    render();
}

function responder(valor) {
    if (estado.tela === "quiz1") {
        estado.respostas1.push(valor);
        estado.indice1++;
        if (estado.indice1 < QUESTOES1.length) { render(); return; }
        finalizarBateria1();
    } else if (estado.tela === "quiz2") {
        estado.respostas2.push(valor);
        estado.indice2++;
        if (estado.indice2 < QUESTOES2.length) { render(); return; }
        finalizarBateria2();
    } else if (estado.tela === "desempate1") {
        estado.respostas1.push(valor);
        estado.principal = topEmpatados(tally(estado.respostas1))[0];
        iniciarBateria2();
    } else if (estado.tela === "desempate2") {
        estado.respostas2.push(valor);
        estado.sombra = topEmpatados(tally(estado.respostas2))[0];
        estado.tela = "resultado";
        render();
    }
}

function finalizarBateria1() {
    const empatados = topEmpatados(tally(estado.respostas1));
    if (empatados.length > 1) {
        estado.tela = "desempate1";
        estado.candidatosDesempate = empatados;
        render();
    } else {
        estado.principal = empatados[0];
        iniciarBateria2();
    }
}

function iniciarBateria2() {
    estado.tela = "quiz2";
    estado.indice2 = 0;
    render();
}

function finalizarBateria2() {
    const empatados = topEmpatados(tally(estado.respostas2));
    if (empatados.length > 1) {
        estado.tela = "desempate2";
        estado.candidatosDesempate = empatados;
        render();
    } else {
        estado.sombra = empatados[0];
        estado.tela = "resultado";
        render();
    }
}

/* ==========================================================================
   RENDERIZAÇÃO
   ========================================================================== */

const app = document.getElementById("app");

function render() {
    if (estado.tela === "intro") return renderIntro();
    if (estado.tela === "quiz1" || estado.tela === "quiz2") return renderPergunta();
    if (estado.tela === "desempate1" || estado.tela === "desempate2") return renderDesempate();
    if (estado.tela === "resultado") return renderResultado();
}

function renderIntro() {
    app.innerHTML = `
        <div class="intro-emblema">🦁 🐘 🦉 🦜</div>
        <h1 class="intro-titulo">Qual é o seu Arquétipo Financeiro?</h1>
        <p class="intro-corpo">Um quiz de 2 minutos baseado no livro <em>Engenharia dos Gastos</em>. Descubra seu arquétipo principal, sua sombra sob pressão — e o animal que representa os dois.</p>
        <button class="btn-primario" onclick="iniciarQuiz()">Começar o quiz</button>
        <p class="intro-rodape">10 perguntas rápidas · sem cadastro pra começar</p>
    `;
}

function renderPergunta() {
    const bateria1 = estado.tela === "quiz1";
    const banco = bateria1 ? QUESTOES1 : QUESTOES2;
    const indice = bateria1 ? estado.indice1 : estado.indice2;
    const q = banco[indice];
    const passoAtual = bateria1 ? indice : QUESTOES1.length + indice;
    const totalPassos = QUESTOES1.length + QUESTOES2.length;

    let barra = "";
    for (let i = 0; i < totalPassos; i++) {
        barra += `<div class="progresso-passo ${i < passoAtual ? "feito" : ""}"></div>`;
    }

    app.innerHTML = `
        <div class="progresso-linha">${barra}</div>
        <span class="tag pergunta-eyebrow">${bateria1 ? "No seu dia a dia" : "Sob pressão"} — pergunta ${indice + 1} de ${banco.length}</span>
        <h2 class="pergunta-texto">${q.texto}</h2>
        <div class="opcoes">
            ${q.opcoes.map(op => `<button class="opcao-btn" onclick="responder('${op.valor}')">${op.label}</button>`).join("")}
        </div>
    `;
}

function renderDesempate() {
    const bateria1 = estado.tela === "desempate1";
    const banco = bateria1 ? DESEMPATE1 : DESEMPATE2;
    const opcoesFiltradas = banco.opcoes.filter(op => estado.candidatosDesempate.includes(op.valor));

    app.innerHTML = `
        <div class="progresso-linha">${estado.candidatosDesempate.map(() => `<div class="progresso-passo feito"></div>`).join("")}</div>
        <span class="tag pergunta-eyebrow">Só mais uma, pra ter certeza</span>
        <h2 class="pergunta-texto">${banco.texto}</h2>
        <div class="opcoes">
            ${opcoesFiltradas.map(op => `<button class="opcao-btn" onclick="responder('${op.valor}')">${op.label}</button>`).join("")}
        </div>
    `;
}

// Meta Pixel: evento de lead ao clicar no CTA de chamar no Instagram

function renderResultado() {
    let dados, integrado;

    if (estado.sombra === estado.principal) {

    } else {

        fbq('track', 'CompleteRegistration', {

            resultado: dados.nome

    // guarda pra geração da imagem de compartilhamento e pra tela de aprofundamento

    app.innerHTML = `
        <div class="ficha">
            <span class="tag ficha-eyebrow">${integrado ? "Perfil Integrado" : "Seu arquétipo financeiro"}</span>

            <p class="ficha-corpo">${dados.corpo}</p>
            <div class="ficha-familias">
                <span class="ficha-familia-badge" style="color:${corPrincipal}">Principal: ${estado.principal}</span>
                ${!integrado ? `<span class="ficha-familia-badge" style="color:${corSombra}">Sombra: ${estado.sombra}</span>` : ""}
            </div>
        </div>

        <button class="btn-primario" onclick="renderAprofundamento()">O que está te sabotando, sem você perceber →</button>
        <button class="compartilhar-btn" id="btnCompartilhar" onclick="compartilharImagem()">📤 Compartilhe nos Stories</button>
    `;
}

// Teste A/B do texto do CTA principal — sorteia uma vez por resultado e
// registra qual apareceu no evento Lead do Pixel, pra comparar taxa de

const CTA_VARIANTES = [
    "Chega de sabotar meu próprio dinheiro",

function renderAprofundamento() {

function quebrarLinhas(ctx, texto, maxWidth) {
    const palavras = texto.split(" ");
    const linhas = [];
    let atual = "";
    palavras.forEach(palavra => {
        const teste = atual ? atual + " " + palavra : palavra;
        if (ctx.measureText(teste).width > maxWidth && atual) {
            linhas.push(atual);
            atual = palavra;
        } else {
            atual = teste;
        }
    });
    if (atual) linhas.push(atual);
    return linhas;
}

// Reduz o tamanho da fonte até o texto caber na largura máxima (nomes de
// bicho variam muito: "Leão" vs "Gorila-das-costas-prateada").
function ajustarTamanhoFonte(ctx, texto, family, peso, tamanhoInicial, larguraMaxima, tamanhoMinimo) {
    let tamanho = tamanhoInicial;
    while (tamanho > tamanhoMinimo) {
        ctx.font = `${peso} ${tamanho}px ${family}`;
        if (ctx.measureText(texto).width <= larguraMaxima) break;
        tamanho -= 4;
    }
    return tamanho;
}

function desenharBadge(ctx, texto, cx, cy, cor) {
    ctx.font = "700 26px 'Space Mono'";
    const largura = ctx.measureText(texto).width + 48;
    const altura = 56;
    const x = cx - largura / 2;
    const y = cy - altura / 2;
    const raio = altura / 2;

    ctx.strokeStyle = cor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + raio, y);
    ctx.lineTo(x + largura - raio, y);
    ctx.arc(x + largura - raio, y + raio, raio, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x + raio, y + altura);
    ctx.arc(x + raio, y + raio, raio, Math.PI / 2, -Math.PI / 2);
    ctx.closePath();
    ctx.stroke();

    ctx.fillStyle = cor;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(texto, cx, cy + 2);

    return largura;
}

async function gerarImagemResultado() {
    const { dados, integrado, corPrincipalHex, corSombraHex } = estado.resultado;

    // garante que as fontes customizadas estejam prontas antes de desenhar
    await document.fonts.load("700 90px Spectral");
    await document.fonts.load("italic 600 42px Spectral");
    await document.fonts.load("400 34px 'Work Sans'");
    await document.fonts.load("700 26px 'Space Mono'");
    await document.fonts.ready;

    const W = 1080, H = 1920;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    // fundo
    ctx.fillStyle = "#14201C";
    ctx.fillRect(0, 0, W, H);
    let grad = ctx.createRadialGradient(160, 220, 0, 160, 220, 900);
    grad.addColorStop(0, "rgba(214,162,74,0.12)");
    grad.addColorStop(1, "rgba(214,162,74,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // moldura
    ctx.strokeStyle = "rgba(214,162,74,0.4)";
    ctx.lineWidth = 2;
    ctx.strokeRect(56, 56, W - 112, H - 112);
    ctx.strokeStyle = "#D6A24A";
    ctx.lineWidth = 3;
    const c = 30;
    [[56, 56, 1, 1], [W - 56, 56, -1, 1], [56, H - 56, 1, -1], [W - 56, H - 56, -1, -1]].forEach(([x, y, dx, dy]) => {
        ctx.beginPath();
        ctx.moveTo(x, y + c * dy);
        ctx.lineTo(x, y);
        ctx.lineTo(x + c * dx, y);
        ctx.stroke();
    });

    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    // eyebrow
    ctx.fillStyle = "#D6A24A";
    ctx.font = "700 26px 'Space Mono'";
    ctx.fillText((integrado ? "PERFIL INTEGRADO" : "ARQUÉTIPO FINANCEIRO"), W / 2, 220);

    // emoji
    ctx.font = "230px sans-serif";
    ctx.fillText(dados.emoji, W / 2, 520);

    // nome (tamanho de fonte se ajusta automaticamente pra caber nomes longos)
    ctx.fillStyle = "#EFE7D3";
    const tamanhoNome = ajustarTamanhoFonte(ctx, dados.nome, "Spectral", "700", 96, W - 160, 44);
    ctx.font = `700 ${tamanhoNome}px Spectral`;
    ctx.fillText(dados.nome, W / 2, 660);

    // binomial
    ctx.fillStyle = "#B9AF98";
    ctx.font = "italic 400 30px 'Space Mono'";
    ctx.fillText(dados.binomial, W / 2, 710);

    // frase-síntese (quebrada em linhas)
    ctx.fillStyle = "#D6A24A";
    ctx.font = "italic 600 46px Spectral";
    const linhasFrase = quebrarLinhas(ctx, `\u201c${dados.frase}\u201d`, 800);
    let yFrase = 820;
    linhasFrase.forEach(linha => {
        ctx.fillText(linha, W / 2, yFrase);
        yFrase += 60;
    });

    // badges de família
    let yBadge = yFrase + 60;
    if (integrado) {
        desenharBadge(ctx, estado.principal.toUpperCase(), W / 2, yBadge, corPrincipalHex);
    } else {
        ctx.font = "700 26px 'Space Mono'";
        const larguraP = ctx.measureText("PRINCIPAL: " + estado.principal.toUpperCase()).width + 48;
        const larguraS = ctx.measureText("SOMBRA: " + estado.sombra.toUpperCase()).width + 48;
        const gap = 20;
        const totalW = larguraP + larguraS + gap;
        desenharBadge(ctx, "PRINCIPAL: " + estado.principal.toUpperCase(), W / 2 - totalW / 2 + larguraP / 2, yBadge, corPrincipalHex);
        desenharBadge(ctx, "SOMBRA: " + estado.sombra.toUpperCase(), W / 2 + totalW / 2 - larguraS / 2, yBadge, corSombraHex);
    }

    // linha divisória
    ctx.strokeStyle = "rgba(239,231,211,0.15)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(160, H - 260);
    ctx.lineTo(W - 160, H - 260);
    ctx.stroke();

    // rodapé / CTA
    ctx.textAlign = "center";
    ctx.fillStyle = "#B9AF98";
    ctx.font = "400 32px 'Work Sans'";
    ctx.fillText("Descubra o seu arquétipo em:", W / 2, H - 190);

    ctx.fillStyle = "#D6A24A";
    ctx.font = "700 36px 'Space Mono'";
    const urlExibida = window.location.host + window.location.pathname.replace(/\/$/, "");
    ctx.fillText(urlExibida, W / 2, H - 140);

    ctx.fillStyle = "#EFE7D3";
    ctx.font = "italic 400 28px Spectral";
    ctx.fillText("Engenharia dos Gastos", W / 2, H - 90);

    return canvas;
}

function compartilharImagem() {
    const btn = document.getElementById("btnCompartilhar");
    const textoOriginal = btn.textContent;
    btn.textContent = "Gerando imagem…";
    btn.disabled = true;

    gerarImagemResultado().then(canvas => {
        canvas.toBlob(async (blob) => {
            btn.textContent = textoOriginal;
            btn.disabled = false;

            const dados = estado.resultado.dados;
            const arquivo = new File([blob], "arquetipo-financeiro.png", { type: "image/png" });
            const texto = `Fiz o quiz de Arquétipo Financeiro e meu resultado foi ${dados.emoji} ${dados.nome}! Faz o seu:`;

            if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                try {
                    await navigator.share({ files: [arquivo], text: texto });
                    return;
                } catch (e) {
                    // usuário cancelou o compartilhamento — não faz nada
                    if (e.name === "AbortError") return;
                }
            }

            // fallback: baixa a imagem pra pessoa postar manualmente
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "arquetipo-financeiro.png";
            link.click();
            alert("Imagem baixada! Agora é só postar ela no seu story do Instagram.");
        }, "image/png", 0.95);
    });
}

render();
